{% macro chart_column_card(t, prefix, render_fn, select_fn, reset_fn, extra_class='') %}
<div class="chart-toolbar mb-2{{ ' ' + extra_class if extra_class }}" id="{{ prefix }}-signal-picker">
    <div class="dropdown position-static">
        <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" id="{{ prefix }}-signals-toggle"
                data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static" aria-expanded="false" aria-controls="{{ prefix }}-columns-body">
            <i class="bi bi-bar-chart-line"></i> {{ t.select_columns_heading }} · <span data-signal-count>0</span>
        </button>
        <div class="dropdown-menu chart-signal-panel p-2 shadow" id="{{ prefix }}-columns-body" aria-labelledby="{{ prefix }}-signals-toggle">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <input type="search" class="form-control form-control-sm chart-signal-search" id="{{ prefix }}-signal-search"
                       placeholder="{{ t.signal_search }}" aria-label="{{ t.signal_search }}" oninput="updateChartPicker('{{ prefix }}')">
                <div class="form-check mb-0">
                    <input type="checkbox" class="form-check-input" id="{{ prefix }}-selected-only" onchange="updateChartPicker('{{ prefix }}')">
                    <label class="form-check-label small" for="{{ prefix }}-selected-only">{{ t.signal_selected_only }}</label>
                </div>
            </div>
            <div class="chart-signal-list">
                {{ caller() }}
                <div class="small text-body-secondary p-2" data-signal-empty hidden role="status">{{ t.signal_no_matches }}</div>
            </div>
            <div class="d-flex flex-wrap justify-content-between gap-2 border-top pt-2 mt-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="chartRestoreDefaults('{{ prefix }}', {{ render_fn }})">{{ t.signal_defaults }}</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="{{ select_fn }}(false)">{{ t.signal_clear }}</button>
            </div>
        </div>
    </div>
    <div class="chart-log-control form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="{{ prefix }}-log-axis" onchange="{{ render_fn }}()">
        <label class="form-check-label small" for="{{ prefix }}-log-axis">{{ t.log_axis }}</label>
    </div>
    <button type="button" class="chart-reset-control btn btn-sm btn-outline-secondary" onclick="{{ reset_fn }}()" title="{{ t.reset_zoom_title }}"><i class="bi bi-arrows-angle-expand"></i> {{ t.reset_zoom }}</button>
</div>
{% endmacro %}

{% macro event_log_viewer(t, content_id, label=none) %}
<div class="event-log-viewer">
    <div class="event-log-toolbar mb-2">
        <div class="event-log-search-controls">
            <input type="search" class="form-control form-control-sm" data-log-search placeholder="{{ t.event_log_search }}" aria-label="{{ t.event_log_search }}" title="{{ t.event_log_search_keys }}">
            <span class="event-log-match-count small" data-log-matches role="status" aria-live="polite"></span>
            <div class="btn-group">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-log-prev disabled title="{{ t.event_log_previous }}" aria-label="{{ t.event_log_previous }}"><i class="bi bi-chevron-up"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-log-next disabled title="{{ t.event_log_next }}" aria-label="{{ t.event_log_next }}"><i class="bi bi-chevron-down"></i></button>
            </div>
        </div>
        <div class="event-log-actions">
            <label class="form-check mb-0 small">
                <input type="checkbox" class="form-check-input" data-log-wrap checked> {{ t.event_log_wrap }}
            </label>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-log-copy title="{{ t.event_log_copy_title }}"><i class="bi bi-copy"></i> {{ t.event_log_copy }}</button>
            <span class="small" data-log-copy-status role="status" aria-live="polite"></span>
        </div>
    </div>
    <div id="{{ content_id }}" class="event-log-content border rounded is-wrapped" tabindex="0" role="region" aria-label="{{ label or t.tab_event_log }}"></div>
</div>
{% endmacro %}
